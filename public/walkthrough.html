<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LEGAL MIND — 3D Walkthrough Study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f0e9;font-family:Arial,sans-serif}canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:#014345}header{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-weight:800;font-size:28px;letter-spacing:-1px;transition:opacity .4s}header span{color:#36a8b3}
#intro{position:absolute;top:17%;left:50%;transform:translateX(-50%);text-align:center;width:min(560px,65vw);transition:opacity .4s}h1{font-size:clamp(32px,4.5vw,68px);line-height:1.15;margin:0;font-weight:800}h1 em{font-style:normal;color:#36a8b3}#intro p{font-size:17px;line-height:1.5;max-width:410px;margin:18px auto}
.choice{position:absolute;top:44%;width:240px;pointer-events:auto;transition:opacity .35s,transform .25s}.choice.left{left:5%;text-align:left;direction:ltr}.choice.right{right:5%;text-align:right}.choice h2{font-size:clamp(24px,3vw,42px);margin:0 0 8px}.choice p{margin:0 0 18px;font-size:16px}.choice button,.back{border:1px solid currentColor;border-radius:30px;background:#faf8f2ca;color:#014345;padding:12px 20px;cursor:pointer;font-size:16px}.choice.right{color:white}.choice.right button{color:white;background:#0143458c}.choice button:hover,.back:hover{transform:translateY(-2px);background:#36a8b3;color:white}
#detail{position:absolute;left:50%;top:28%;width:min(560px,75vw);transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .65s;text-shadow:0 1px 18px #fff8;display:none}#detail h2{font-size:clamp(42px,5vw,70px);margin:0 0 12px}#detail p{font-size:20px}.back{pointer-events:auto;background:#fff;min-width:150px}
#notice{position:absolute;bottom:18px;left:20px;font-size:12px;color:#365b58;opacity:.75;direction:ltr}#loading{position:fixed;inset:0;display:grid;place-items:center;color:#014345;font:18px Arial;background:#faf9f4;z-index:10}
@media(max-width:750px){#intro{top:14%;width:94vw}#intro p{font-size:14px}.choice{top:auto;bottom:14%;width:42%}.choice h2{font-size:21px}.choice p{font-size:13px}.choice.left{left:5%}.choice.right{right:5%}#detail{top:35%}}
</style>
</head>
<body><div id="loading">טוען סצנת תלת־ממד…</div><div id="ui">
<header id="brand">legalmind<span>.</span></header>
<div id="intro"><h1>קודם בינה משפטית.<br/><em>אחר כך מלאכותית.</em></h1><p>שני מסלולים מקצועיים. גישה אחת שמתחילה בעבודה המשפטית.</p></div>
<div id="minders" class="choice left"><h2>MINDERS</h2><p>למידה, קהילה והתפתחות מקצועית</p><button id="goLeft" aria-label="Enter MINDERS">← להיכנס</button></div>
<div id="firm" class="choice right"><h2>הטמעת AI<br/>במשרדי עורכי דין</h2><p>הטמעה מעשית וליווי מקצועי</p><button id="goRight" aria-label="Enter AI Implementation">להיכנס →</button></div>
<div id="detail"><h2 id="detailTitle"></h2><p id="detailText"></p><button class="back" id="back">חזרה לשני המסלולים ↩</button></div>
<div id="notice">3D interaction study · procedural geometry · not final architecture</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf7f6f2);scene.fog=new THREE.Fog(0xf7f6f2,16,42);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.05,110);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
document.body.prepend(renderer.domElement);
const M=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const ivory=M(0xeee6d7,.65),cream=M(0xe2d2b8,.58),teal=M(0x014345,.42,.26),dark=M(0x163736,.55),wood=M(0xbca184,.7),chair=M(0xc6bcb0,.8),ink=M(0x263332,.6);
const glass=new THREE.MeshPhysicalMaterial({color:0xa3d8d2,transparent:true,opacity:.22,roughness:.08,metalness:.04,side:THREE.DoubleSide,depthWrite:false});
function box(w,h,d,x,y,z,mat,rotation=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.rotation.y=rotation;o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function cyl(r,h,x,y,z,mat){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,32),mat);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
function torus(r,t,x,y,z,color,rotX=Math.PI/2){const o=new THREE.Mesh(new THREE.TorusGeometry(r,t,9,96),new THREE.MeshBasicMaterial({color}));o.position.set(x,y,z);o.rotation.x=rotX;scene.add(o);return o}
function curvedWall(cx,z0,r,ang1,ang2,material){const shape=new THREE.CylinderGeometry(r,r,4,64,1,true,ang1,ang2-ang1);const o=new THREE.Mesh(shape,material);o.position.set(cx,2,z0);scene.add(o);return o}
scene.add(new THREE.HemisphereLight(0xffffff,0x9db7b0,2.2));
const sun=new THREE.DirectionalLight(0xfff2d8,3);sun.position.set(-7,13,8);scene.add(sun);
box(40,.16,40,0,-.1,-12,M(0xf0eee7,.3));box(40,12,.25,0,6,-20,M(0xf7f6f0,.85));
box(40,.2,25,0,8,-13,M(0xfaf9f5,.8));
const podLeft=-6.2,podRight=6.2,roomZ=-10.8;
cyl(4,.12,podLeft,.05,roomZ,ivory);cyl(4,.12,podRight,.05,roomZ,teal);
curvedWall(podLeft,roomZ,4,-Math.PI*.05,Math.PI*.93,glass);
curvedWall(podRight,roomZ,4,-Math.PI*.05,Math.PI*.93,glass);
curvedWall(podLeft,roomZ,4,Math.PI*.95,Math.PI*1.96,ivory);
curvedWall(podRight,roomZ,4,Math.PI*.95,Math.PI*1.96,teal);
cyl(4,.25,podLeft,4.15,roomZ,ivory);cyl(4,.25,podRight,4.15,roomZ,teal);
torus(2,.035,podLeft,3.64,roomZ,0xffe4b4);torus(2,.035,podRight,3.64,roomZ,0xb8f5ee);
for(let i=0;i<5;i++){box(3,.07,.55,podLeft-1.65,.65+i*.56,roomZ-2.75,wood);for(let j=0;j<13;j++){let h=.25+((i+j)%4)*.035;box(.11,h,.25,podLeft-3.1+j*.235,.76+i*.56+h/2,roomZ-2.7,M(j%4===0?0x78968e:0xddd2bd,.9));}}
cyl(1.12,.12,podLeft,.87,roomZ,wood);cyl(.12,.85,podLeft,.42,roomZ,wood);
for(let a=0;a<5;a++){const t=a*Math.PI*2/5;cyl(.28,.48,podLeft+Math.cos(t)*1.65,.46,roomZ+Math.sin(t)*1.65,chair);}
box(3,.13,1.25,podRight,1.05,roomZ,ink);for(const sx of [-1.25,1.25])for(const sz of [-.83,.83])cyl(.3,.62,podRight+sx,.45,roomZ+sz,dark);
for(let i=0;i<6;i++){const px=podRight+(i%3-1)*1.45,pz=roomZ+(i<3?-1.55:1.55);box(.56,.58,.56,px,.46,pz,dark);}
const entrances={home:{pos:new THREE.Vector3(0,3.6,11),look:new THREE.Vector3(0,1.6,-10)},left:{pos:new THREE.Vector3(podLeft,2.15,-8.6),look:new THREE.Vector3(podLeft,1.5,-13.4)},right:{pos:new THREE.Vector3(podRight,2.15,-8.6),look:new THREE.Vector3(podRight,1.5,-13.4)}};
camera.position.copy(entrances.home.pos);let look=entrances.home.look.clone(),state='home',start=0,duration=1800,fromP=camera.position.clone(),fromL=look.clone(),targetP=fromP.clone(),targetL=fromL.clone(),animating=false;
const ids=['brand','intro','minders','firm'];function showUI(value){for(const id of ids)document.getElementById(id).style.opacity=value?'1':'0';for(const id of ['goLeft','goRight'])document.getElementById(id).disabled=!value;}
function navigate(s){if(animating)return;animating=true;state=s;start=performance.now();fromP.copy(camera.position);fromL.copy(look);targetP.copy(entrances[s].pos);targetL.copy(entrances[s].look);
if(s==='home'){document.getElementById('detail').style.opacity='0';setTimeout(()=>{document.getElementById('detail').style.display='none'},500);}
else{showUI(false);document.getElementById('detailTitle').textContent=s==='left'?'MINDERS':'הטמעת AI במשרדי עורכי דין';document.getElementById('detailText').textContent=s==='left'?'מרחב למידה מקצועי לעורכי דין':'ליווי מעשי בהטמעת בינה מלאכותית בעבודה המשפטית';}
}
document.getElementById('goLeft').onclick=()=>navigate('left');document.getElementById('goRight').onclick=()=>navigate('right');document.getElementById('back').onclick=()=>navigate('home');
function render(time){requestAnimationFrame(render);if(animating){let p=Math.min((time-start)/duration,1);let e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;camera.position.lerpVectors(fromP,targetP,e);look.lerpVectors(fromL,targetL,e);if(p===1){animating=false;if(state==='home'){showUI(true)}else{const d=document.getElementById('detail');d.style.display='block';requestAnimationFrame(()=>d.style.opacity='1');}}}
camera.lookAt(look);renderer.render(scene,camera);}
renderer.setAnimationLoop(null);requestAnimationFrame(render);
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
if(matchMedia('(prefers-reduced-motion: reduce)').matches)duration=100;
document.getElementById('loading').remove();
</script></body></html>
